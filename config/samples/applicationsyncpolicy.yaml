# Keeps the three apps in sync as a group, in the same order as applicationsync.yaml.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSyncPolicy
metadata:
  name: guestbooks
spec:
  concurrencyPolicy: Forbid
  template:
    skipIfSynced: true
    groups:
    - name: first
      apps:
      - name: guestbook
    - name: rest
      dependsOn: [first]
      apps:
      - name: helm-guestbook
      - name: kustomize-guestbook
