---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: applicationsyncpolicies.argoproj.io
spec:
  group: argoproj.io
  names:
    kind: ApplicationSyncPolicy
    listKind: ApplicationSyncPolicyList
    plural: applicationsyncpolicies
    shortNames:
    - appsyncpolicy
    - appsyncpolicies
    singular: applicationsyncpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.currentRun
      name: Current
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ApplicationSyncPolicy creates an ApplicationSync from its template whenever one of its apps is OutOfSync.
          In effect it is auto-sync for a group of apps.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ApplicationSyncPolicySpec is the template for the ApplicationSyncs
              a policy creates
            properties:
              concurrencyPolicy:
                description: |-
                  ConcurrencyPolicy decides what happens when apps drift while a run is unfinished: Forbid (default) waits for
                  it to finish, Replace deletes it and starts a new one
                enum:
                - Forbid
                - Replace
                type: string
              template:
                description: Template is the spec of each ApplicationSync the policy
                  creates
                properties:
                  doneWhen:
                    description: 'DoneWhen decides when an app counts as done: SyncedAndHealthy
                      (default) or Healthy'
                    enum:
                    - SyncedAndHealthy
                    - Healthy
                    type: string
                  dryRun:
                    description: DryRun specifies to perform a `kubectl apply --dry-run`
                      without actually performing the sync
                    type: boolean
                  groups:
                    description: |-
                      Groups of Applications to sync. A group starts once the groups it depends on have succeeded, and its
                      apps sync in parallel. The apps must be in the same namespace as the ApplicationSync.
                    items:
                      description: ApplicationSyncGroup is a set of Applications synced
                        in parallel, after the groups it depends on.
                      properties:
                        apps:
                          description: Apps to sync in this group. A group with no
                            apps counts as complete.
                          items:
                            description: ApplicationSyncApp is an Application to sync.
                            properties:
                              name:
                                description: Name of the Application
                                minLength: 1
                                type: string
                              prune:
                                description: Prune overrides spec.prune for this app
                                type: boolean
                              resources:
                                description: Resources limits the sync to these resources,
                                  as in the Sync API
                                items:
                                  description: SyncOperationResource contains resources
                                    to sync.
                                  properties:
                                    group:
                                      type: string
                                    kind:
                                      type: string
                                    name:
                                      type: string
                                    namespace:
                                      type: string
                                  required:
                                  - kind
                                  - name
                                  type: object
                                type: array
                              retry:
                                description: Retry overrides spec.retry and the app's
                                  own syncPolicy.retry for this app
                                properties:
                                  backoff:
                                    description: Backoff controls how to backoff on
                                      subsequent retries of failed syncs
                                    properties:
                                      duration:
                                        description: Duration is the amount to back
                                          off. Default unit is seconds, but could
                                          also be a duration (e.g. "2m", "1h")
                                        type: string
                                      factor:
                                        description: Factor is a factor to multiply
                                          the base duration after each failed retry
                                        format: int64
                                        type: integer
                                      maxDuration:
                                        description: MaxDuration is the maximum amount
                                          of time allowed for the backoff strategy
                                        type: string
                                    type: object
                                  limit:
                                    description: Limit is the maximum number of attempts
                                      for retrying a failed sync. If set to 0, no
                                      retries will be performed.
                                    format: int64
                                    type: integer
                                  refresh:
                                    description: 'Refresh indicates if the latest
                                      revision should be used on retry instead of
                                      the initial one (default: false)'
                                    type: boolean
                                type: object
                              revisions:
                                description: |-
                                  Revisions pins sources of the app. A source that isn't listed syncs to its targetRevision as resolved when
                                  the app's sync starts.
                                items:
                                  description: ApplicationSyncRevision pins one source
                                    of an app. Single-source apps set neither Source
                                    nor Position.
                                  properties:
                                    position:
                                      description: Position is the 1-based index of
                                        the source in spec.sources
                                      format: int32
                                      minimum: 1
                                      type: integer
                                    revision:
                                      description: |-
                                        Revision to sync the source to. It is passed to the sync as given, so use a commit SHA, an exact chart
                                        version or a digest to be sure every app in the run gets the same one.
                                      minLength: 1
                                      type: string
                                    source:
                                      description: Source is the name of the source
                                        in spec.sources
                                      type: string
                                  required:
                                  - revision
                                  type: object
                                  x-kubernetes-validations:
                                  - message: set source or position, not both
                                    rule: '!(has(self.source) && has(self.position))'
                                type: array
                            required:
                            - name
                            type: object
                          type: array
                          x-kubernetes-list-map-keys:
                          - name
                          x-kubernetes-list-type: map
                        dependsOn:
                          description: DependsOn names other groups whose apps must
                            all be synced and Healthy before this group starts
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: set
                        maxParallel:
                          anyOf:
                          - type: integer
                          - type: string
                          description: |-
                            MaxParallel caps how many apps in the group sync at once, as a number or a percentage of the group.
                            A percentage that rounds down to 0 becomes 1, except 0%. 0 or 0% pauses the group.
                          x-kubernetes-int-or-string: true
                        name:
                          default: default
                          description: |-
                            Name of the group, unique within the ApplicationSync. Defaults to "default", so it can be left out when there
                            is only one group; two unnamed groups are rejected as duplicates.
                          minLength: 1
                          type: string
                      type: object
                    minItems: 1
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  info:
                    description: Info is added to each app's operation
                    items:
                      properties:
                        name:
                          type: string
                        value:
                          type: string
                      required:
                      - name
                      - value
                      type: object
                    type: array
                  initiatedBy:
                    description: |-
                      InitiatedBy is copied into each app's operation. It is informational only and never used for authorization.
                      When Automated is true, sync windows are checked with automatic semantics.
                    properties:
                      automated:
                        description: Automated is set to true if operation was initiated
                          automatically by the application controller.
                        type: boolean
                      username:
                        description: Username contains the name of a user who started
                          operation
                        type: string
                    type: object
                  onFailure:
                    description: |-
                      OnFailure decides what happens when an app fails: Fail (default) fails it and skips its dependents, Wait keeps
                      it Progressing until it is done
                    enum:
                    - Fail
                    - Wait
                    type: string
                  paused:
                    description: |-
                      Paused stops new app syncs from starting; syncs already running finish. It is the only field that can
                      change after creation.
                    type: boolean
                  prune:
                    description: Prune specifies to delete resources from the cluster
                      that are no longer tracked in git
                    type: boolean
                  retry:
                    description: Retry overrides each Application's spec.syncPolicy.retry
                      when set
                    properties:
                      backoff:
                        description: Backoff controls how to backoff on subsequent
                          retries of failed syncs
                        properties:
                          duration:
                            description: Duration is the amount to back off. Default
                              unit is seconds, but could also be a duration (e.g.
                              "2m", "1h")
                            type: string
                          factor:
                            description: Factor is a factor to multiply the base duration
                              after each failed retry
                            format: int64
                            type: integer
                          maxDuration:
                            description: MaxDuration is the maximum amount of time
                              allowed for the backoff strategy
                            type: string
                        type: object
                      limit:
                        description: Limit is the maximum number of attempts for retrying
                          a failed sync. If set to 0, no retries will be performed.
                        format: int64
                        type: integer
                      refresh:
                        description: 'Refresh indicates if the latest revision should
                          be used on retry instead of the initial one (default: false)'
                        type: boolean
                    type: object
                  skipIfSynced:
                    description: SkipIfSynced counts an app that is already Synced
                      at its revisions as synced, without starting a sync
                    type: boolean
                  syncOptions:
                    description: SyncOptions override each Application's spec.syncPolicy.syncOptions
                      when set
                    items:
                      type: string
                    type: array
                  syncStrategy:
                    description: SyncStrategy describes how to perform the sync
                    properties:
                      apply:
                        description: Apply will perform a `kubectl apply` to perform
                          the sync.
                        properties:
                          force:
                            description: |-
                              Force indicates whether or not to supply the --force flag to `kubectl apply`.
                              The --force flag deletes and re-create the resource, when PATCH encounters conflict and has
                              retried for 5 times.
                            type: boolean
                        type: object
                      hook:
                        description: Hook will submit any referenced resources to
                          perform the sync. This is the default strategy
                        properties:
                          force:
                            description: |-
                              Force indicates whether or not to supply the --force flag to `kubectl apply`.
                              The --force flag deletes and re-create the resource, when PATCH encounters conflict and has
                              retried for 5 times.
                            type: boolean
                        type: object
                    type: object
                required:
                - groups
                type: object
            required:
            - template
            type: object
          status:
            description: ApplicationSyncPolicyStatus is the observed state of an ApplicationSyncPolicy
            properties:
              currentRun:
                description: CurrentRun is the name of the ApplicationSync the policy
                  created last
                type: string
              message:
                type: string
            type: object
        required:
        - metadata
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
