apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-application-sync-controller
  labels:
    app.kubernetes.io/name: argocd-application-sync-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-application-sync-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-application-sync-controller
    spec:
      serviceAccountName: argocd-application-sync-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager
        image: controller
        args:
        - --argocd-namespace=$(ARGOCD_NAMESPACE)
        - --leader-elect
        env:
        - name: ARGOCD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        - name: metrics
          containerPort: 8080
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
